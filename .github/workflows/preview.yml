name: PR preview (Cloudflare)

# Builds the Jekyll site for every pull request and uploads it as a
# non-production Worker *version*, which Cloudflare serves at a unique
# preview URL. Production (the live deployment) is never touched — only
# `wrangler deploy` does that, and this workflow uses `versions upload`.
on:
  pull_request:
    branches: [master]

# Same-repo PRs get the secrets they need; fork PRs run without them and
# the deploy step is skipped rather than failing.
permissions:
  contents: read
  pull-requests: write

# One in-flight preview per PR; newer pushes cancel older runs.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Upload preview version
        id: deploy
        if: ${{ env.CF_API_TOKEN != '' }}
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # v4 is required: the action's default wrangler (3.90.0) rejects
          # `versions upload` for an assets-only Worker ("Missing entry-point").
          wranglerVersion: "4"
          command: versions upload

      - name: Comment preview URL on the PR
        if: ${{ steps.deploy.outputs.deployment-url != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.deployment-url }}';
            const marker = '<!-- cf-preview -->';
            const body = [
              marker,
              '### 🚀 Cloudflare preview',
              '',
              `**Preview URL:** ${url}`,
              '',
              `Built from ${context.sha.substring(0, 7)} · re-deploys on every push to this PR.`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
